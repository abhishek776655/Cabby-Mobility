spring.application.name=eureka-service

server.port=${EUREKA_SERVICE_PORT:8761}

eureka.instance.hostname=${EUREKA_HOST:localhost}
eureka.instance.prefer-ip-address=false

# Peer-awareness: set EUREKA_REGISTER_WITH_EUREKA/EUREKA_FETCH_REGISTRY=true and
# EUREKA_PEER_ZONE to the other node's /eureka/ URL to run as an HA pair.
# Defaults keep single-node standalone behavior for local `mvn spring-boot:run`.
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:false}
eureka.client.service-url.defaultZone=${EUREKA_PEER_ZONE:http://${eureka.instance.hostname}:${server.port}/eureka/}

eureka.server.wait-time-in-ms-when-sync-empty=0
eureka.server.eviction-interval-timer-in-ms=60000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
