# Server
server.port=${GATEWAY_SERVICE_PORT:8080}
spring.main.web-application-type=reactive
spring.application.name=gateway-service

# ===============================
# EUREKA SERVICE DISCOVERY
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME}:${server.port}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# GATEWAY ROUTES (using Eureka service IDs)
# ===============================
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=cab-service
spring.cloud.gateway.routes[2].uri=lb://cab-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/cab/**,/rides/**,/dispatch/**

spring.cloud.gateway.routes[3].id=driver-service
spring.cloud.gateway.routes[3].uri=lb://driver-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/driver/**,/drivers/**

spring.cloud.gateway.routes[4].id=location-service-public
spring.cloud.gateway.routes[4].uri=lb://location-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/location/driver/online,/location/driver/offline,/location/driver/update

spring.cloud.gateway.routes[5].id=matchmaking-service
spring.cloud.gateway.routes[5].uri=lb://matchmaking-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/matchmaking/**

spring.cloud.gateway.routes[6].id=rider-service
spring.cloud.gateway.routes[6].uri=lb://rider-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/riders/**

spring.cloud.gateway.routes[7].id=pricing-service
spring.cloud.gateway.routes[7].uri=lb://pricing-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/fares/**,/surge/**

spring.cloud.gateway.routes[8].id=payment-service
spring.cloud.gateway.routes[8].uri=lb://payment-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/wallet/**


# ===============================
# RATE LIMITING (Redis)
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Auth service rate limit
spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=1000
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=2000

# User service rate limit
spring.cloud.gateway.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.replenishRate=1000
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=2000

# Cab service rate limit with circuit breaker
spring.cloud.gateway.routes[2].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[2].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.routes[2].filters[0].args.redis-rate-limiter.replenishRate=1000
spring.cloud.gateway.routes[2].filters[0].args.redis-rate-limiter.burstCapacity=2000
spring.cloud.gateway.routes[2].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[1].args.name=cabServiceCB
spring.cloud.gateway.routes[2].filters[1].args.fallbackUri=forward:/fallback/cab

# Auth service circuit breaker
spring.cloud.gateway.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[1].args.name=authServiceCB
spring.cloud.gateway.routes[0].filters[1].args.fallbackUri=forward:/fallback/auth

# User service circuit breaker
spring.cloud.gateway.routes[1].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[1].args.name=userServiceCB
spring.cloud.gateway.routes[1].filters[1].args.fallbackUri=forward:/fallback/user

# Driver service circuit breaker
spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=driverServiceCB
spring.cloud.gateway.routes[3].filters[0].args.fallbackUri=forward:/fallback/driver

# Location service circuit breaker
spring.cloud.gateway.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[4].filters[0].args.name=locationServiceCB
spring.cloud.gateway.routes[4].filters[0].args.fallbackUri=forward:/fallback/location

# Matchmaking service circuit breaker
spring.cloud.gateway.routes[5].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[5].filters[0].args.name=matchmakingServiceCB
spring.cloud.gateway.routes[5].filters[0].args.fallbackUri=forward:/fallback/matchmaking

# Rider service circuit breaker
spring.cloud.gateway.routes[6].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[6].filters[0].args.name=riderServiceCB
spring.cloud.gateway.routes[6].filters[0].args.fallbackUri=forward:/fallback/rider

# Pricing service circuit breaker
spring.cloud.gateway.routes[7].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[7].filters[0].args.name=pricingServiceCB
spring.cloud.gateway.routes[7].filters[0].args.fallbackUri=forward:/fallback/pricing

# Pricing service: public /fares, /surge paths map to the service's actual
# /internal/** controllers, which require the internal secret header like
# every other internal-only endpoint in this codebase.
spring.cloud.gateway.routes[7].filters[1].name=RewritePath
spring.cloud.gateway.routes[7].filters[1].args.regexp=/(fares|surge)(.*)
spring.cloud.gateway.routes[7].filters[1].args.replacement=/internal/$1$2
spring.cloud.gateway.routes[7].filters[2].name=AddRequestHeader
spring.cloud.gateway.routes[7].filters[2].args.name=X-Internal-Secret
spring.cloud.gateway.routes[7].filters[2].args.value=${INTERNAL_API_SECRET:secret}

# Payment service circuit breaker
spring.cloud.gateway.routes[8].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[8].filters[0].args.name=paymentServiceCB
spring.cloud.gateway.routes[8].filters[0].args.fallbackUri=forward:/fallback/payment

# Payment service: public /wallet paths map to the service's actual
# /internal/wallet controller, which requires the internal secret header like
# every other internal-only endpoint in this codebase.
spring.cloud.gateway.routes[8].filters[1].name=RewritePath
spring.cloud.gateway.routes[8].filters[1].args.regexp=/wallet(.*)
spring.cloud.gateway.routes[8].filters[1].args.replacement=/internal/wallet$1
spring.cloud.gateway.routes[8].filters[2].name=AddRequestHeader
spring.cloud.gateway.routes[8].filters[2].args.name=X-Internal-Secret
spring.cloud.gateway.routes[8].filters[2].args.value=${INTERNAL_API_SECRET:secret}

# ===============================
# CIRCUIT BREAKER CONFIG
# ===============================
resilience4j.circuitbreaker.instances.cabServiceCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.cabServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.cabServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.cabServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.cabServiceCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.cabServiceCB.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.authServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.authServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.authServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authServiceCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.authServiceCB.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.userServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.userServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userServiceCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.userServiceCB.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.driverServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.driverServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.driverServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.driverServiceCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.driverServiceCB.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.locationServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.locationServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.locationServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.locationServiceCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.locationServiceCB.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.matchmakingServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.matchmakingServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.matchmakingServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.matchmakingServiceCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.matchmakingServiceCB.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.pricingServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.pricingServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.pricingServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.pricingServiceCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.pricingServiceCB.permittedNumberOfCallsInHalfOpenState=2
# pricing-service calls routing-service with 3 retries at 250ms*attempt backoff
# (up to ~1.5s) before its own Haversine fallback kicks in — the default 1s
# TimeLimiter timeout was firing before pricing-service could even finish,
# forcing every call through this fallback regardless of actual health.
resilience4j.timelimiter.instances.pricingServiceCB.timeoutDuration=4s

resilience4j.circuitbreaker.instances.riderServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.riderServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.riderServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.riderServiceCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.riderServiceCB.permittedNumberOfCallsInHalfOpenState=2

resilience4j.circuitbreaker.instances.paymentServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentServiceCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.paymentServiceCB.permittedNumberOfCallsInHalfOpenState=2

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET:mySecretKeyForDevelopmentOnly12345678901234567890}

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# ===============================
# DISTRIBUTED TRACING
# ===============================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
