global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["auth-service:8091"]

  - job_name: user-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["user-service:8081"]

  - job_name: cab-service
    metrics_path: /actuator/prometheus
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ["cab-service:8089"]

  - job_name: driver-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["driver-service:8084"]

  - job_name: location-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["location-service:8090"]

  - job_name: matchmaking-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["matchmaking-service:8087"]

  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: realtime-gateway-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["realtime-gateway-service:8095"]

  - job_name: rider-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["rider-service:8082"]

  - job_name: eureka-service
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["eureka-service:8761"]

  - job_name: cadvisor
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["cadvisor:8080"]
