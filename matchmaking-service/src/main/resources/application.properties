spring.application.name=matchmaking-service

# ===============================
# EUREKA SERVICE DISCOVERY
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

server.port=${MATCHMAKING_SERVICE_PORT:8087}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MATCHMAKING_DB:matchmaking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Service URLs
services.location.url=${LOCATION_SERVICE_URL:http://location-service:8090}
services.driver.url=${DRIVER_SERVICE_URL:http://driver-service:8084}

internal.api.secret=${INTERNAL_API_SECRET:changeme-internal-secret-dev}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

matchmaking.default-radius-km=5
# Over-fetched: filterEligibleDrivers() strips out anyone with an active reservation
# (i.e. genuinely on-trip) AFTER this fetch, so the limit needs enough headroom that
# the post-filter candidate list doesn't collapse to 1-2 drivers under real load.
matchmaking.default-limit=40

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

dispatch.assignment.timeout-seconds=30
dispatch.assignment.max-retries=10
