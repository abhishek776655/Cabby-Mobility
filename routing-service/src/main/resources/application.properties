spring.application.name=routing-service
server.port=${ROUTING_SERVICE_PORT:8097}

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Valhalla Configuration
valhalla.url=${VALHALLA_URL:http://valhalla:8002}
valhalla.timeout-ms=5000

# Photon Configuration (address autocomplete)
photon.url=${PHOTON_URL:http://photon:2322}
# The photon index covers all of India, but valhalla only holds NewDelhi tiles — an address
# outside that box is unroutable, so a rider could autocomplete a destination that then fails
# at dispatch. This bbox is applied server-side on every query (see GeocodeServiceImpl) rather
# than trusted from the client, so no caller can widen it. Order: minLon,minLat,maxLon,maxLat.
photon.bbox=${PHOTON_BBOX:76.84,28.40,77.35,28.88}
# Bias results toward central Delhi when the client sends no location of its own.
photon.default-lat=${PHOTON_DEFAULT_LAT:28.6315}
photon.default-lon=${PHOTON_DEFAULT_LON:77.2167}
photon.max-results=${PHOTON_MAX_RESULTS:8}

# Redis (route cache)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Observability
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

# Internal API
internal.api.secret=${INTERNAL_API_SECRET:secret}
