spring.application.name=routing-service
server.port=${ROUTING_SERVICE_PORT:8097}

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Valhalla Configuration
valhalla.url=${VALHALLA_URL:http://valhalla:8002}
valhalla.timeout-ms=5000

# Observability
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Tracing
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

# Internal API
internal.api.secret=${INTERNAL_API_SECRET:secret}
