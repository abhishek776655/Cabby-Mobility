spring.application.name=location-service

# ===============================
# EUREKA SERVICE DISCOVERY
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME}:${server.port}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

server.port=${LOCATION_SERVICE_PORT:8090}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
services.driver.url=${DRIVER_SERVICE_URL:http://localhost:8084}
internal.api.secret=${INTERNAL_API_SECRET:changeme-internal-secret-dev}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# ===============================
# DISTRIBUTED TRACING
# ===============================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
